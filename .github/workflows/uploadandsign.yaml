name: Build and Publish i686 Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build in Void container
        run: |
          docker run --rm --privileged \
            -v "$PWD":/workspace \
            -w /workspace \
            ghcr.io/void-linux/void-glibc-full \
            sh -euxc '
              xbps-install -Syu xbps
              xbps-install -yu
              xbps-install -y sudo bash git curl shadow

              useradd -m builder
              chown -R builder:builder /workspace

              sudo -Hu builder ./xbps-src binary-bootstrap -a i686

              sudo -Hu builder ./xbps-src pkg -a i686 libdrm

              sudo -Hu builder ./xbps-src pkg -a i686 xf86-video-amdgpu

              sudo -Hu builder ./xbps-src pkg -a i686 mesa
            '

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: i686-packages
          path: hostdir/binpkgs

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: i686-packages
          path: artifact

      - name: Install xbps tools
        run: |
          docker run --rm \
            -v "$PWD":/work \
            -w /work \
            ghcr.io/void-linux/void-glibc-full \
            sh -c '
              xbps-install -Sy xbps
            '

      - name: Restore signing key
        run: |
          echo "${{ secrets.REPO_SIGN_KEY }}" > privkey.pem

      - name: Copy packages
        run: |
          mkdir -p repo/i686

          find artifact -type f \( -name "*.xbps" -o -name "*.sig2" \) \
            ! -name "rust-*.xbps" \
            ! -name "rust-*.sig2" \
            ! -name "rust-bootstrap-*.xbps" \
            ! -name "rust-bootstrap-*.sig2" \
            ! -name "cargo-*.xbps" \
            ! -name "cargo-*.sig2" \
            -exec cp {} repo/i686/ \;

      - name: Generate repository metadata and signatures
        run: |
          docker run --rm \
            -v "$PWD/repo/i686":/repo \
            -v "$PWD/privkey.pem":/privkey.pem \
            ghcr.io/void-linux/void-glibc-full \
            sh -euxc '
              xbps-rindex -a /repo/*.xbps

              xbps-rindex \
                --sign \
                --signedby "Lollo <you@example.com>" \
                --privkey /privkey.pem \
                /repo

              xbps-rindex \
                --sign-pkg \
                --privkey /privkey.pem \
                /repo/*.xbps
            '

      - name: Commit repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f repo/i686

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Update signed i686 repository"
          git push