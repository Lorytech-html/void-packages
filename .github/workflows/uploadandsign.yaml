name: Import and Sign i686 Repository

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Direct URL of the ZIP containing the compiled .xbps packages"
        required: true
        type: string

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download xbps static tools
        run: |
          set -eux

          curl -L \
            https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz \
            -o xbps-static.tar.xz

          mkdir -p xbps-static
          tar -xf xbps-static.tar.xz -C xbps-static

      - name: Download ZIP
        run: |
          set -eux
          curl -L "${{ github.event.inputs.zip_url }}" -o packages.zip

      - name: Prepare repository
        run: |
          set -eux

          rm -rf extracted
          mkdir -p repo/i686

          unzip -o packages.zip -d extracted

          find repo/i686 -mindepth 1 -delete

          find extracted -type f -name '*.i686.xbps' -exec cp {} repo/i686/ \;
          find extracted -type f -name '*.i686.xbps.sig2' -exec cp {} repo/i686/ \;

          find repo/i686 -type f \( \
            -name 'rust-*.xbps' -o \
            -name 'rust-*.xbps.sig2' -o \
            -name 'rust-bootstrap-*.xbps' -o \
            -name 'rust-bootstrap-*.xbps.sig2' -o \
            -name 'rust-std-*.xbps' -o \
            -name 'rust-std-*.xbps.sig2' -o \
            -name 'rust-src-*.xbps' -o \
            -name 'rust-src-*.xbps.sig2' -o \
            -name 'rust-doc-*.xbps' -o \
            -name 'rust-doc-*.xbps.sig2' -o \
            -name 'cargo-*.xbps' -o \
            -name 'cargo-*.xbps.sig2' -o \
            -name 'cargo-bootstrap-*.xbps' -o \
            -name 'cargo-bootstrap-*.xbps.sig2' \
          \) -delete

          rm -f repo/i686/*repodata*
          rm -f repo/i686/index*
          rm -f repo/i686/*.plist

          ls -lah repo/i686

      - name: Restore signing key
        run: |
          set -eux
          printf "%s" "${{ secrets.REPO_SIGN_KEY }}" > privkey.pem
          chmod 600 privkey.pem

      - name: Generate repository metadata
        run: |
          set -eux

          export PATH="$PWD/xbps-static/usr/bin:$PATH"

          cd repo/i686

          ls -lah

          XBPS_TARGET_ARCH=i686 xbps-rindex -a *.xbps

          ls -lah

      - name: Sign repository
        run: |
          set -eux

          export PATH="$PWD/xbps-static/usr/bin:$PATH"

          cd repo/i686

          xbps-rindex \
            --sign \
            --signedby "lore <loresigned@example.com>" \
            --privkey ../../privkey.pem \
            .

      - name: Sign packages
        run: |
          set -eux

          export PATH="$PWD/xbps-static/usr/bin:$PATH"

          cd repo/i686

          for pkg in *.xbps; do
            xbps-rindex \
              --sign-pkg \
              --privkey ../../privkey.pem \
              "$pkg"
          done

      - name: Cleanup
        run: |
          rm -f privkey.pem packages.zip
          rm -rf extracted

      - name: Commit and push
        run: |
          set -eux

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f repo/i686

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Update signed i686 repository"
          git push origin master
