name: Import and Sign i686 Repository

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Direct URL of the ZIP containing the compiled .xbps packages"
        required: true
        type: string

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download xbps static tools
        run: |
          curl -L \
            https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz \
            -o xbps-static.tar.xz

          mkdir xbps-static
          tar -xf xbps-static.tar.xz -C xbps-static

      - name: Download ZIP
        run: |
          curl -L "${{ github.event.inputs.zip_url }}" -o packages.zip

      - name: Prepare repository
        run: |
          mkdir -p repo/i686

          unzip -o packages.zip -d extracted

          find extracted -type f -name "*.xbps" -exec cp -f {} repo/i686/ \;
          find extracted -type f -name "*.sig2" -exec cp -f {} repo/i686/ \;

          rm -f repo/i686/*-repodata
          rm -f repo/i686/*-repodata.sig
          rm -f repo/i686/*-repodata.sig2

      - name: Restore signing key
        run: |
          echo "${{ secrets.REPO_SIGN_KEY }}" > privkey.pem
          chmod 600 privkey.pem

      - name: Generate repository metadata
        run: |
          export PATH="$PWD/xbps-static/usr/bin:$PATH"

          xbps-rindex -a repo/i686/*.xbps

      - name: Sign repository
        run: |
          export PATH="$PWD/xbps-static/usr/bin:$PATH"

          xbps-rindex \
            --sign \
            --signedby "Lollo <you@example.com>" \
            --privkey privkey.pem \
            repo/i686

      - name: Sign packages
        run: |
          export PATH="$PWD/xbps-static/usr/bin:$PATH"

          xbps-rindex \
            --sign-pkg \
            --privkey privkey.pem \
            repo/i686/*.xbps

      - name: Cleanup
        run: |
          rm -f privkey.pem packages.zip
          rm -rf extracted

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f repo/i686

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Update signed i686 repository"
          git push origin master