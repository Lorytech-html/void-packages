name: Import and Sign i686 Repository

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Direct URL of the ZIP containing the compiled .xbps packages"
        required: true
        type: string

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download xbps static tools
        run: |
          curl -L \
            https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz \
            -o xbps-static.tar.xz

          mkdir xbps-static
          tar -xf xbps-static.tar.xz -C xbps-static

      - name: Download ZIP
        run: |
          curl -L "${{ github.event.inputs.zip_url }}" -o packages.zip

      - name: Prepare repository
        run: |
          set -eux

          mkdir -p repo/i686

          unzip -o downloaded.zip -d extracted

          find extracted -type f -name '*.xbps' -exec cp {} repo/i686/ \;
          find extracted -type f -name '*.sig2' -exec cp {} repo/i686/ \;

          echo "Removing old repodata..."
          rm -f repo/i686/*repodata*
          rm -f repo/i686/index*
          rm -f repo/i686/*.plist

          echo "Removing oversized Rust packages..."
          find repo/i686 -type f \( \
            -name 'rust-*.xbps' -o \
            -name 'rust-*.xbps.sig2' -o \
            -name 'rust-bootstrap-*.xbps' -o \
            -name 'rust-bootstrap-*.xbps.sig2' -o \
            -name 'rust-std-*.xbps' -o \
            -name 'rust-std-*.xbps.sig2' -o \
            -name 'rust-src-*.xbps' -o \
            -name 'rust-src-*.xbps.sig2' -o \
            -name 'rust-doc-*.xbps' -o \
            -name 'rust-doc-*.xbps.sig2' -o \
            -name 'cargo-*.xbps' -o \
            -name 'cargo-*.xbps.sig2' -o \
            -name 'cargo-bootstrap-*.xbps' -o \
            -name 'cargo-bootstrap-*.xbps.sig2' \
          \) -delete

          echo "Remaining packages:"
          ls -lh repo/i686

      - name: Restore signing key
        run: |
          echo "${{ secrets.REPO_SIGN_KEY }}" > privkey.pem
          chmod 600 privkey.pem

      - name: Generate repository metadata
        run: |
          export PATH="$PWD/xbps-static/usr/bin:$PATH"

          xbps-rindex -a repo/i686/*.xbps

      - name: Sign repository
        run: |
          export PATH="$PWD/xbps-static/usr/bin:$PATH"

          xbps-rindex \
            --sign \
            --signedby "Lollo <you@example.com>" \
            --privkey privkey.pem \
            repo/i686

      - name: Sign packages
        run: |
          export PATH="$PWD/xbps-static/usr/bin:$PATH"

          xbps-rindex \
            --sign-pkg \
            --privkey privkey.pem \
            repo/i686/*.xbps

      - name: Cleanup
        run: |
          rm -f privkey.pem packages.zip
          rm -rf extracted

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f repo/i686

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Update signed i686 repository"
          git push origin master