name: build-ps4-repo
on:
  workflow_dispatch:
    inputs:
      package_url:
        description: 'Link diretto al file .xbps (es. asset di una Release)'
        required: true

# Concede i permessi di scrittura al token del workflow
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download driver package
        run: |
          mkdir -p repo/x86_64
          cd repo/x86_64
          curl -L -O "${{ github.event.inputs.package_url }}"

      - name: Generate xbps repo index
        run: |
          docker run --rm \
            -v "$PWD/repo/x86_64":/repo \
            ghcr.io/void-linux/void-glibc-full \
            sh -c 'xbps-rindex -a /repo/*.xbps'

      - name: Commit repo to this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f repo/x86_64
          git commit -m "update ps4 driver repo" || echo "nothing to commit"
          git push
