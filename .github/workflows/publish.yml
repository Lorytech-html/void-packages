name: build-ps4-drivers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build in Void container
        run: |
          docker run --rm --privileged \
            -v "$PWD":/workspace \
            -w /workspace \
            ghcr.io/void-linux/void-glibc-full \
            sh -ec '
              xbps-install -Syu xbps
              xbps-install -yu
              xbps-install -y sudo bash git curl shadow findutils

              useradd -m builder
              chown -R builder:builder /workspace

              sudo -Hu builder ./xbps-src binary-bootstrap

              sudo -Hu builder ./xbps-src pkg libdrm

              sudo -Hu builder ./xbps-src pkg xf86-video-amdgpu || {
                echo "=== PATCH REJECTS ==="
                find / -name "*.rej" -exec sh -c "echo ==== \$1 ====; cat \$1" sh {} \;
                exit 1
              }

              sudo -Hu builder ./xbps-src pkg mesa
            '

      - name: Create XBPS repository
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            ghcr.io/void-linux/void-glibc-full \
            sh -ec '
              xbps-install -Sy xbps findutils

              rm -f repo/x86_64/*.xbps
              rm -f repo/x86_64/xbps-repodata*

              find hostdir/binpkgs \
                -type f \
                -name "*.xbps" \
                ! -path "*/bootstrap/*" \
                -exec cp {} repo/x86_64/ \;

              xbps-rindex -fa repo/x86_64/*.xbps
            '

      - name: Upload repository
        uses: actions/upload-artifact@v4
        with:
          name: ps4-drivers-repo
          path: repo/x86_64

      - name: Commit updated repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add repo/x86_64

          git diff --cached --quiet && exit 0

          git commit -m "Update XBPS repository"
          git push