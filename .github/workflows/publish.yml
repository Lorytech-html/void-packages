name: build-ps4-repo
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Link al file .zip (Release o Artefatto di Actions)'
        required: true

permissions:
  contents: write
  actions: read # Necessario per scaricare gli artefatti

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and unpack drivers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p repo/x86_64
          URL="${{ github.event.inputs.zip_url }}"

          # Se l'URL contiene l'ID di un artefatto di GitHub Actions
          if [[ "$URL" =~ artifacts/([0-9]+) ]]; then
            ARTIFACT_ID="${BASH_REMATCH[1]}"
            echo "Rilevato Artefatto di GitHub Actions (ID: $ARTIFACT_ID). Download tramite GitHub CLI..."
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > ps4-drivers.zip
          else
            echo "Download URL generico tramite curl..."
            curl -L "$URL" -o ps4-drivers.zip
          fi

          # Estrazione dei pacchetti .xbps
          unzip -j -o ps4-drivers.zip "*.xbps" -d repo/x86_64
          rm ps4-drivers.zip

      - name: Generate xbps repo index
        run: |
          docker run --rm \
            -v "$PWD/repo/x86_64":/repo \
            ghcr.io/void-linux/void-glibc-full \
            sh -c 'xbps-rindex -a /repo/*.xbps'

      - name: Commit repo to this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f repo/x86_64
          git commit -m "update ps4 driver repo" || echo "nothing to commit"
          git push
