name: build-ps4-repo
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Link diretto al file ps4-drivers.zip (es. asset di una Release)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and unpack drivers
        run: |
          mkdir -p repo/x86_64
          curl -L "${{ github.event.inputs.zip_url }}" -o ps4-drivers.zip
          unzip -j -o ps4-drivers.zip "*.xbps" -d repo/x86_64
          rm ps4-drivers.zip

      - name: Generate xbps repo index
        run: |
          docker run --rm \
            -v "$PWD/repo/x86_64":/repo \
            ghcr.io/void-linux/void-glibc-full \
            sh -c 'xbps-rindex -a /repo/*.xbps'

      - name: Commit repo to this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f repo/x86_64
          git commit -m "update ps4 driver repo" || echo "nothing to commit"
          git push
