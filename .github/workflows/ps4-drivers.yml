name: build-ps4-drivers

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build in Void container
        run: |
          docker run --rm --privileged \
            -v "$PWD":/workspace \
            -w /workspace \
            ghcr.io/void-linux/void-glibc-full \
            sh -c '
              set -e

              xbps-install -Syu xbps
              xbps-install -yu
              xbps-install -y sudo bash git curl shadow

              useradd -m builder || true
              chown -R builder:builder /workspace

              sudo -Hu builder ./xbps-src binary-bootstrap

              sudo -Hu builder ./xbps-src pkg libdrm

              echo "=== USING TEMPLATE ==="
              pwd
              grep -n "subpackages=" srcpkgs/mesa/template || true
              grep -n "libgbm-mesa" srcpkgs/mesa/template || true
              grep -n "libgbm" srcpkgs/mesa/template || true

              sudo -Hu builder ./xbps-src pkg mesa || {
                  echo "========== REJECT FILES =========="
                  find / -name "*.rej" 2>/dev/null | while read -r f; do
                      echo "----- $f -----"
                      cat "$f"
                      cp "$f" /workspace/$(basename "$f")
                  done
                  exit 1
              }

              sudo -Hu builder ./xbps-src pkg xf86-video-amdgpu
            '

      - name: Upload reject files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-rejects
          path: |
            *.rej
            **/*.rej
          if-no-files-found: ignore

      - name: Upload packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ps4-drivers
          path: hostdir/binpkgs/**/*.xbps
          if-no-files-found: ignore