name: build-ps4-drivers

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/void-linux/void-glibc-full:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug
        run: |
          pwd
          ls -la
          ls -la xbps-src || true
          file xbps-src || true

      - name: Update xbps
        run: |
          xbps-install -Syu
          xbps-install -y bash git curl

      - name: Bootstrap
        run: |
          chmod +x xbps-src
          ./xbps-src binary-bootstrap

      - name: Build libdrm
        run: ./xbps-src pkg libdrm

      - name: Build xf86-video-amdgpu
        run: ./xbps-src pkg xf86-video-amdgpu

      - name: Build mesa
        run: ./xbps-src pkg mesa

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ps4-drivers
          path: hostdir/binpkgs/*.xbps