name: Build PS4 Linux RootFS

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-rootfs:
    runs-on: ubuntu-latest

    # Job eseguito direttamente dentro il container Void Linux
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installa dipendenze di sistema nel container
        run: |
          # 'github-cli' fornisce il comando 'gh' su Void
          xbps-install -Sy -y github-cli curl tar xz

      - name: Download artifact da void-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/packages
          gh run download 30049135182 --repo Lorytech-html/void-packages --dir /tmp/packages

      - name: Prepara /rootfs e installa il pacchetto (pacman -U per Void)
        run: |
          # 1. Prepara la struttura e copia le chiavi di firma XBPS
          mkdir -p /rootfs /rootfs/var/db/xbps/keys
          cp -a /var/db/xbps/keys/* /rootfs/var/db/xbps/keys/

          # 2. Crea l'indice del repository locale con i pacchetti .xbps scaricati
          cd /tmp/packages
          xbps-rindex -a *.xbps

          # 3. Installa base-system e il pacchetto locale dentro /rootfs
          xbps-install -Sy -y \
            -R https://repo-default.voidlinux.org/current \
            -R /tmp/packages \
            -r /rootfs \
            base-system *.xbps

      - name: Comprimi RootFS
        run: |
          mkdir -p /workspace
          tar \
            --numeric-owner \
            --xattrs \
            -C /rootfs \
            -cJf /workspace/ps4linux.tar.xz .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4linux-rootfs
          path: /workspace/ps4linux.tar.xz
