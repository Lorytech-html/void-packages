name: get ps4 tar xz plz
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rootfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download drivers artifact
        uses: dawidd6/action-download-artifact@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: 30049135182
          name: ps4-drivers
          path: .

      - name: Extract artifact
        run: |
          unzip -o ps4-drivers.zip
          ls -R

      - name: Build rootfs
        run: |
          docker run --rm --privileged \
            -v "$PWD":/workspace \
            -w /workspace \
            ghcr.io/void-linux/void-glibc-full \
            sh -ec '
              xbps-install -Syu xbps

              mkdir -p /rootfs

              xbps-install -Sy \
                -r /rootfs \
                -R https://repo-default.voidlinux.org/current \
                base-voidstrap runit-void

              xbps-install -Sy -f \
                -r /rootfs \
                -R /workspace/hostdir/binpkgs \
                -R https://repo-default.voidlinux.org/current \
                libdrm \
                libdrm-devel \
                mesa \
                mesa-dri \
                mesa-vulkan-radeon \
                xf86-video-amdgpu

              xbps-remove -O -r /rootfs

              tar \
                --numeric-owner \
                --xattrs \
                --exclude=./var/cache/xbps \
                -C /rootfs \
                -cJf /workspace/ps4linux.tar.xz .
            '

      - name: Upload rootfs
        uses: actions/upload-artifact@v4
        with:
          name: ps4linux-rootfs
          path: ps4linux.tar.xz