name: build-ps4-drivers
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ac_gpu_info.c
        run: |
          curl -sL https://mesa3d.org/archive/mesa-26.1.5.tar.xz -o mesa.tar.xz
          tar -xf mesa.tar.xz mesa-26.1.5/src/amd/common/ac_gpu_info.c
          grep -n -B3 -A15 "case CHIP_BONAIRE" mesa-26.1.5/src/amd/common/ac_gpu_info.c
