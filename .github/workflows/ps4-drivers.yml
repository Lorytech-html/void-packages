name: Buil PS4 Drivers

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Install Docker dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl tar xz-utils

      - name: Clone official void-packages
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git

      - name: Copy templates
        run: |
          cp overlay/srcpkgs/libdrm/template \
             void-packages/srcpkgs/libdrm/

          cp overlay/srcpkgs/mesa/template \
             void-packages/srcpkgs/mesa/

          cp overlay/srcpkgs/xf86-video-amdgpu/template \
             void-packages/srcpkgs/xf86-video-amdgpu/

      - name: Copy patches
        run: |
          mkdir -p void-packages/srcpkgs/libdrm/patches
          mkdir -p void-packages/srcpkgs/mesa/patches
          mkdir -p void-packages/srcpkgs/xf86-video-amdgpu/patches

          cp -av overlay/srcpkgs/libdrm/patches/. \
              void-packages/srcpkgs/libdrm/patches/

          cp -av overlay/srcpkgs/mesa/patches/. \
              void-packages/srcpkgs/mesa/patches/

          cp -av overlay/srcpkgs/xf86-video-amdgpu/patches/. \
              void-packages/srcpkgs/xf86-video-amdgpu/patches/

      - name: Pull build container
        run: |
          docker pull ghcr.io/void-linux/xbps-src-masterdir:latest-x86_64

      - name: Build packages
        run: |
          docker run --rm --privileged \
            -v "$PWD/void-packages":/build \
            -w /build \
            ghcr.io/void-linux/xbps-src-masterdir:latest-x86_64 \
            sh -ec '
              xbps-install -Syu
              ./xbps-src binary-bootstrap
              ./xbps-src pkg libdrm
              ./xbps-src pkg xf86-video-amdgpu
              ./xbps-src pkg mesa
            '

      - name: List packages
        run: |
          find void-packages/hostdir/binpkgs -name "*.xbps" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps4-drivers
          path: void-packages/hostdir/binpkgs/**/*.xbps