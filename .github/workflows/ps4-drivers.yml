name: build-ps4-drivers

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            curl \
            wget \
            git \
            xz-utils \
            tar \
            bzip2 \
            file \
            bubblewrap \
            libarchive-tools

      - name: Install xbps-static
        run: |
          mkdir -p "$HOME/xbps"
          cd "$HOME/xbps"
          wget https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz
          tar -xf xbps-static-latest.x86_64-musl.tar.xz
          echo "$HOME/xbps/usr/bin" >> $GITHUB_PATH

      - name: Configure xbps-src
        run: |
          echo 'XBPS_CHROOT_CMD=bwrap' >> etc/conf

      - name: Bootstrap
        run: |
          chmod +x xbps-src
          ./xbps-src binary-bootstrap

      - name: Build libdrm
        run: ./xbps-src pkg libdrm

      - name: Build xf86-video-amdgpu
        run: ./xbps-src pkg xf86-video-amdgpu

      - name: Build mesa
        run: ./xbps-src pkg mesa

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ps4-drivers
          path: hostdir/binpkgs/**/*.xbps