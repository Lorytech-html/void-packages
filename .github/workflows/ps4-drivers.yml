name: Build PS4 Linux RootFS

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-rootfs:
    runs-on: ubuntu-latest

    # Eseguiamo il job dentro il container ufficiale di Void Linux
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installa dipendenze di sistema nel container
        run: |
          xbps-install -Sy -y gh curl tar xz

      - name: Download artifact da void-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/packages
          # Scarica gli artifact della run specificata tramite GitHub CLI
          gh run download 30049135182 --repo Lorytech-html/void-packages --dir /tmp/packages

      - name: Prepara /rootfs e installa il pacchetto (pacman -U per Void)
        run: |
          # 1. Crea la directory target /rootfs
          mkdir -p /rootfs /rootfs/var/db/xbps/keys
          
          # Copia le chiavi di firma XBPS dentro il rootfs per consentire l'installazione
          cp -a /var/db/xbps/keys/* /rootfs/var/db/xbps/keys/

          # 2. Crea l'indice del repository locale per i pacchetti .xbps scaricati
          cd /tmp/packages
          xbps-rindex -a *.xbps

          # 3. Installa base-system e il pacchetto locale dentro /rootfs
          # -R include sia i mirror ufficiali che la cartella locale dei pacchetti
          xbps-install -Sy -y \
            -R https://repo-default.voidlinux.org/current \
            -R /tmp/packages \
            -r /rootfs \
            base-system *.xbps

      - name: Comprimi RootFS
        run: |
          mkdir -p /workspace
          tar \
            --numeric-owner \
            --xattrs \
            -C /rootfs \
            -cJf /workspace/ps4linux.tar.xz .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4linux-rootfs
          path: /workspace/ps4linux.tar.xz
