name: Build PS4 Drivers

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Clone void-packages
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git

      - name: Copy PS4 patches
        run: |
          cp -r overlay/srcpkgs/libdrm void-packages/srcpkgs/
          cp -r overlay/srcpkgs/mesa void-packages/srcpkgs/
          cp -r overlay/srcpkgs/xf86-video-amdgpu void-packages/srcpkgs/

      - name: Build Void packages
        run: |
          docker run --rm \
            --privileged \
            -v "$PWD/void-packages:/void-packages" \
            ghcr.io/void-linux/xbps-src-masterdir:latest-x86_64 \
            /bin/sh -c '

              set -e

              echo "=== Updating xbps ==="
              xbps-install -Syu xbps

              echo "=== Check tools ==="
              id
              ls /bin/xbps-src || true
              ls /void-packages

              echo "=== Permissions ==="
              chown -R xbuilder:xbuilder /void-packages

              echo "=== Config ==="
              echo "XBPS_CHROOT_CMD=xbps-uchroot" > /void-packages/etc/conf

              echo "=== Build as xbuilder ==="

              cd /void-packages

              su-exec xbuilder ./xbps-src binary-bootstrap
              su-exec xbuilder ./xbps-src pkg libdrm
              su-exec xbuilder ./xbps-src pkg xf86-video-amdgpu
              su-exec xbuilder ./xbps-src pkg mesa

            '

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ps4-drivers
          path: void-packages/hostdir/binpkgs/**/*.xbps