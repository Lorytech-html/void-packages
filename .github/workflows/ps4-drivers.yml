name: build-ps4-drivers
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build in Void container
        run: |
          docker run --rm --privileged \
            -v "$PWD":/workspace -w /workspace \
            ghcr.io/void-linux/void-glibc-full \
            sh -c '
              xbps-install -Syu xbps &&
              xbps-install -yu &&
              xbps-install -y sudo bash git curl shadow &&
              useradd -m builder &&
              chown -R builder:builder /workspace &&
              sudo -Hu builder ./xbps-src binary-bootstrap &&
              sudo -Hu builder ./xbps-src pkg libdrm &&
              sudo -Hu builder ./xbps-src pkg mesa &&
              (sudo -Hu builder ./xbps-src pkg xf86-video-amdgpu || {
                echo "=== PATCH REJECTS ===";
                find / -name "*.rej" 2>/dev/null | while read -r f; do
                  echo "--- $f ---";
                  cat "$f";
                done;
                exit 1;
              })
            '

      - uses: actions/upload-artifact@v4
        with:
          name: ps4-drivers
          path: hostdir/binpkgs/**/*.xbps