name: Build PS4 Drivers

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout overlay repo
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Clone void-packages
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git

      - name: Copy PS4 package templates and patches
        run: |
          cp -r overlay/srcpkgs/libdrm void-packages/srcpkgs/
          cp -r overlay/srcpkgs/mesa void-packages/srcpkgs/
          cp -r overlay/srcpkgs/xf86-video-amdgpu void-packages/srcpkgs/

      - name: Configure xbps-src
        run: |
          cd void-packages
          mkdir -p etc
          echo "XBPS_CHROOT_CMD=uchroot" > etc/conf
          cat etc/conf

      - name: Build Void packages
        run: |
          docker run --rm \
            --privileged \
            -v "$PWD/void-packages:/void-packages" \
            ghcr.io/void-linux/xbps-src-masterdir:latest-x86_64 \
            bash -c '
              set -e

              echo "Updating xbps..."
              xbps-install -Suy xbps

              echo "Updating system..."
              xbps-install -Suy

              echo "Installing base tools..."
              xbps-install -y shadow git bash tar curl

              echo "Creating builder user..."
              useradd -m builder

              echo "Fixing permissions..."
              chown -R builder:builder /void-packages

              echo "Setting chroot method..."
              echo "XBPS_CHROOT_CMD=uchroot" > /void-packages/etc/conf

              echo "Starting build..."

              su - builder -c "
                cd /void-packages

                ./xbps-src binary-bootstrap

                ./xbps-src pkg libdrm

                ./xbps-src pkg xf86-video-amdgpu

                ./xbps-src pkg mesa
              "
            '

      - name: Upload PS4 driver packages
        uses: actions/upload-artifact@v4
        with:
          name: ps4-drivers
          path: void-packages/hostdir/binpkgs/**/*.xbps