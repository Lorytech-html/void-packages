name: Build PS4 Drivers

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/void-linux/xbps-src-masterdir:latest-x86_64
      options: --privileged

    steps:
      - uses: actions/checkout@v4
        with:
          path: overlay

      - name: Update container
        run: |
          xbps-install -Syu
          xbps-install -y git bash

      - name: Clone official void-packages
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git

      - name: Overlay PS4 patches
        run: |
          cp overlay/srcpkgs/libdrm/template \
             void-packages/srcpkgs/libdrm/

          cp overlay/srcpkgs/mesa/template \
             void-packages/srcpkgs/mesa/

          cp overlay/srcpkgs/xf86-video-amdgpu/template \
             void-packages/srcpkgs/xf86-video-amdgpu/

          mkdir -p void-packages/srcpkgs/libdrm/patches
          mkdir -p void-packages/srcpkgs/mesa/patches
          mkdir -p void-packages/srcpkgs/xf86-video-amdgpu/patches

          cp overlay/srcpkgs/libdrm/patches/* \
             void-packages/srcpkgs/libdrm/patches/

          cp overlay/srcpkgs/mesa/patches/* \
             void-packages/srcpkgs/mesa/patches/

          cp overlay/srcpkgs/xf86-video-amdgpu/patches/* \
             void-packages/srcpkgs/xf86-video-amdgpu/patches/

      - name: Bootstrap
        working-directory: void-packages
        run: ./xbps-src binary-bootstrap

      - name: Build libdrm
        working-directory: void-packages
        run: ./xbps-src pkg libdrm

      - name: Build xf86-video-amdgpu
        working-directory: void-packages
        run: ./xbps-src pkg xf86-video-amdgpu

      - name: Build mesa
        working-directory: void-packages
        run: ./xbps-src pkg mesa

      - uses: actions/upload-artifact@v4
        with:
          name: ps4-drivers
          path: void-packages/hostdir/binpkgs/**/*.xbps