name: Build PS4 Void Drivers

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone Void packages
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git void-packages

      - name: Apply PS4 patches
        run: |
          mkdir -p void-packages/srcpkgs/libdrm/patches
          mkdir -p void-packages/srcpkgs/mesa/patches
          mkdir -p void-packages/srcpkgs/xf86-video-amdgpu/patches

          cp patches/libdrm-liverpool.patch \
            void-packages/srcpkgs/libdrm/patches/

          cp patches/mesa-liverpool.patch \
            void-packages/srcpkgs/mesa/patches/

          cp patches/xf86-video-amdgpu-liverpool.patch \
            void-packages/srcpkgs/xf86-video-amdgpu/patches/

      - name: Build packages
        run: |
          docker run --rm \
            --privileged \
            -v "$PWD/void-packages:/void-packages" \
            ghcr.io/void-linux/xbps-src-masterdir:latest-x86_64 \
            /bin/sh -c '

              set -e

              echo "=== Create xbuilder ==="

              adduser -D -u 1000 xbuilder || true

              echo "=== Update XBPS ==="

              xbps-install -Syu xbps

              echo "=== Check ==="

              id xbuilder
              ls -la /void-packages/xbps-src

              chmod +x /void-packages/xbps-src


              echo "=== Permissions ==="

              chown -R xbuilder:xbuilder /void-packages


              echo "=== Config ==="

              echo "XBPS_CHROOT_CMD=xbps-uchroot" \
                > /void-packages/etc/conf


              echo "=== Bootstrap ==="

              cd /void-packages

              su xbuilder -c "./xbps-src binary-bootstrap"


              echo "=== Build libdrm ==="

              su xbuilder -c "./xbps-src pkg libdrm"


              echo "=== Build xf86-video-amdgpu ==="

              su xbuilder -c "./xbps-src pkg xf86-video-amdgpu"


              echo "=== Build mesa ==="

              su xbuilder -c "./xbps-src pkg mesa"


              echo "=== Done ==="

              ls -lah /void-packages/hostdir/binpkgs

            '

      - name: Upload XBPS packages
        uses: actions/upload-artifact@v4
        with:
          name: ps4-void-drivers
          path: |
            void-packages/hostdir/binpkgs/*.xbps