name: Inspect xbps-src image

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect container
        run: |
          docker run --rm \
            ghcr.io/void-linux/xbps-src-masterdir:latest-x86_64 \
            sh -c '
              echo "=== SHELL ==="
              echo $SHELL

              echo "=== PATH ==="
              echo $PATH

              echo "=== ROOT FILES ==="
              ls /

              echo "=== BIN ==="
              ls /bin || true

              echo "=== USR BIN CHECK ==="
              ls /usr/bin | head -100

              echo "=== COMMANDS ==="
              which sh || true
              which bash || true
              which xbps-src || true
              which xbps-install || true
              which useradd || true
              which su || true

              echo "=== XBPS PACKAGES ==="
              xbps-query -l | head -100 || true
            '

      - name: Inspect Void image
        run: |
          docker run --rm \
            ghcr.io/void-linux/xbps-src-masterdir:latest-x86_64 \
            sh -c '
              echo PATH=$PATH
              ls /
              which sh || true
              which bash || true
              which xbps-src || true
              ls /bin || true
            '

      - name: Checkout overlay repo
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Clone void-packages
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git

      - name: Copy PS4 patches
        run: |
          cp -r overlay/srcpkgs/libdrm void-packages/srcpkgs/
          cp -r overlay/srcpkgs/mesa void-packages/srcpkgs/
          cp -r overlay/srcpkgs/xf86-video-amdgpu void-packages/srcpkgs/

      - name: Configure xbps-src
        run: |
          cd void-packages
          mkdir -p etc
          echo "XBPS_CHROOT_CMD=uchroot" > etc/conf
          cat etc/conf

      - name: Build packages
        run: |
          docker run --rm \
            --privileged \
            -v "$PWD/void-packages:/void-packages" \
            ghcr.io/void-linux/void-linux:latest-full-x86_64 \
            bash -c '

              set -e

              echo "Update XBPS"
              xbps-install -Suy xbps

              echo "Update system"
              xbps-install -Suy

              echo "Install tools"
              xbps-install -y git bash tar curl shadow util-linux

              echo "Create builder"
              useradd -m builder

              echo "Permissions"
              chown -R builder:builder /void-packages

              echo "Build as builder"

              runuser -u builder -- bash -c "
                cd /void-packages

                echo Config:
                cat etc/conf

                ./xbps-src binary-bootstrap

                ./xbps-src pkg libdrm

                ./xbps-src pkg xf86-video-amdgpu

                ./xbps-src pkg mesa
              "
            '

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ps4-drivers
          path: void-packages/hostdir/binpkgs/**/*.xbps