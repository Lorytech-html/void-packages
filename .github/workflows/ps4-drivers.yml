name:  du bist gut genugg

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rootfs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dawidd6/action-download-artifact@v9
        with:
          repo: Lorytech-html/void-packages
          run_id: 30049135182
          name: ps4-drivers
          path: .

      - name: Build PS4 rootfs
        run: |
          docker run --rm --privileged \
            -v "$PWD":/workspace \
            -w /workspace \
            ghcr.io/void-linux/void-glibc-full \
            sh -euxc '
              xbps-install -Syu xbps

              mkdir -p /repo
              cp *.xbps /repo/
              cp bootstrap/*.xbps /repo/

              xbps-rindex -a /repo/*.xbps

              mkdir -p /rootfs

              xbps-install \
                -S -y \
                -r /rootfs \
                -R https://repo-default.voidlinux.org/current \
                base-voidstrap \
                runit-void

              xbps-install \
                -y \
                -r /rootfs \
                -R /repo \
                -R https://repo-default.voidlinux.org/current \
                -f \
                libdrm \
                mesa \
                mesa-dri \
                mesa-vulkan-radeon \
                xf86-video-amdgpu

              xbps-remove -r /rootfs -Oo

              rm -rf /rootfs/var/cache/xbps

              tar \
                --numeric-owner \
                --xattrs \
                -C /rootfs \
                -cJf /workspace/ps4linux.tar.xz .
            '

      - uses: actions/upload-artifact@v4
        with:
          name: ps4linux-rootfs
          path: ps4linux.tar.xz          
  