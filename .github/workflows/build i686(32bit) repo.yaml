name: build-ps4-drivers-i686

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build i686 drivers in Void container
        run: |
          docker run --rm --privileged \
            -v "$PWD":/workspace \
            -w /workspace \
            ghcr.io/void-linux/void-glibc-full \
            sh -c '
              set -ex

              xbps-install -Syu xbps
              xbps-install -yu
              xbps-install -y sudo bash git curl shadow

              useradd -m builder
              chown -R builder:builder /workspace

              echo "===== Bootstrap ====="
              sudo -Hu builder ./xbps-src -A i686 binary-bootstrap

              echo "===== Build libdrm ====="
              sudo -Hu builder ./xbps-src -A i686 pkg libdrm

              echo "===== Build xf86-video-amdgpu ====="
              sudo -Hu builder ./xbps-src -A i686 pkg xf86-video-amdgpu || {
                echo "=== PATCH REJECTS ==="
                find / -name "*.rej" 2>/dev/null | while read -r f; do
                  echo "--- $f ---"
                  cat "$f"
                done
                exit 1
              }

              echo "===== Build mesa ====="
              sudo -Hu builder ./xbps-src -A i686 pkg mesa

              echo "===== Produced packages ====="
              find hostdir/binpkgs -type f \( -name "*.xbps" -o -name "*.sig2" \)
            '

      - name: Create i686 repository
        run: |
          mkdir -p repo/i686

      - name: Copy packages
        run: |
          find hostdir/binpkgs -type f \( -name "*.xbps" -o -name "*.sig2" \) \
            -exec cp -n {} repo/i686/ \;

      - name: Index i686 repository
        run: |
          docker run --rm \
            -v "$PWD/repo/i686":/repo \
            ghcr.io/void-linux/void-glibc-full \
            sh -c '
              xbps-rindex -a /repo/*.xbps
            '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps4-drivers-i686
          path: |
            hostdir/binpkgs/**/*.xbps
            hostdir/binpkgs/**/*.sig2

      - name: Commit updated repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f repo/i686

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Add i686 packages"
          git push