name: build-and-sign-ps4-32bit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build i686 drivers in Void container
        run: |
          docker run --rm --privileged \
            -v "$PWD":/workspace \
            -w /workspace \
            ghcr.io/void-linux/void-glibc-full \
            sh -c '
              set -ex

              xbps-install -Syu xbps
              xbps-install -yu
              xbps-install -y sudo bash git curl shadow

              useradd -m builder
              chown -R builder:builder /workspace

              echo "===== Bootstrap ====="
              sudo -Hu builder ./xbps-src -a i686 binary-bootstrap

              echo "===== Build libdrm ====="
              sudo -Hu builder ./xbps-src -a i686 pkg libdrm

              echo "===== Build xf86-video-amdgpu ====="
              sudo -Hu builder ./xbps-src -a i686 pkg xf86-video-amdgpu || {
                echo "=== PATCH REJECTS ==="
                find / -name "*.rej" 2>/dev/null | while read -r f; do
                  echo "--- $f ---"
                  cat "$f"
                done
                exit 1
              }

              echo "===== Build mesa ====="
              sudo -Hu builder ./xbps-src -a i686 pkg mesa

              echo "===== Produced packages ====="
              find hostdir/binpkgs -type f \( -name "*.xbps" -o -name "*.sig2" \)
            '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-32bit-packages
          path: |
            hostdir/binpkgs/**/*.xbps
            hostdir/binpkgs/**/*.sig2

  repository:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wipe repo/i686
        run: |
          rm -rf repo/i686
          mkdir -p repo/i686

      - name: Download xbps static tools
        run: |
          curl -L \
            https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz \
            -o xbps-static.tar.xz
          mkdir xbps-static
          tar -xf xbps-static.tar.xz -C xbps-static

      - name: Download compiled packages
        uses: actions/download-artifact@v4
        with:
          name: x86_64-32bit-packages
          path: extracted

      - name: Prepare repository
        run: |
          set -eux

          echo "Copying i686 packages..."
          find extracted -type f -name '*.i686.xbps' -exec cp -n {} repo/i686/ \;
          find extracted -type f -name '*.i686.xbps.sig2' -exec cp -n {} repo/i686/ \;

          echo "Copying 32bit multilib packages (x86_64, for coexistence)..."
          find extracted -type f -name '*-32bit-*.x86_64.xbps' -exec cp -n {} repo/i686/ \;
          find extracted -type f -name '*-32bit-*.x86_64.xbps.sig2' -exec cp -n {} repo/i686/ \;

          echo "Removing old repodata..."
          rm -f repo/i686/*repodata*
          rm -f repo/i686/index*
          rm -f repo/i686/*.plist

          echo "Removing oversized Rust packages..."
          find repo/i686 -type f \( \
            -name 'rust-*.xbps' -o \
            -name 'rust-*.xbps.sig2' -o \
            -name 'rust-bootstrap-*.xbps' -o \
            -name 'rust-bootstrap-*.xbps.sig2' -o \
            -name 'rust-std-*.xbps' -o \
            -name 'rust-std-*.xbps.sig2' -o \
            -name 'rust-src-*.xbps' -o \
            -name 'rust-src-*.xbps.sig2' -o \
            -name 'rust-doc-*.xbps' -o \
            -name 'rust-doc-*.xbps.sig2' -o \
            -name 'cargo-*.xbps' -o \
            -name 'cargo-*.xbps.sig2' -o \
            -name 'cargo-bootstrap-*.xbps' -o \
            -name 'cargo-bootstrap-*.xbps.sig2' \
          \) -delete

          echo "Remaining packages:"
          ls -lh repo/i686

      - name: Restore signing key
        run: |
          echo "${{ secrets.REPO_SIGN_KEY }}" > "$GITHUB_WORKSPACE/privkey.pem"
          chmod 600 "$GITHUB_WORKSPACE/privkey.pem"

      - name: Generate repository metadata
        run: |
          export PATH="$PWD/xbps-static/usr/bin:$PATH"
          xbps-rindex -a "$GITHUB_WORKSPACE/repo/i686"/*.xbps

      - name: Sign repository
        run: |
          export PATH="$PWD/xbps-static/usr/bin:$PATH"
          xbps-rindex \
            --sign \
            --signedby "Lollo PS4" \
            --privkey "$GITHUB_WORKSPACE/privkey.pem" \
            "$GITHUB_WORKSPACE/repo/i686"

      - name: Sign packages
        run: |
          export PATH="$PWD/xbps-static/usr/bin:$PATH"
          xbps-rindex \
            --sign-pkg \
            --privkey "$GITHUB_WORKSPACE/privkey.pem" \
            "$GITHUB_WORKSPACE/repo/i686"/*.xbps

      - name: Cleanup
        run: |
          rm -f "$GITHUB_WORKSPACE/privkey.pem"
          rm -rf extracted xbps-static xbps-static.tar.xz

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A repo/i686

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Update signed i686 repository"
          git push origin HEAD
