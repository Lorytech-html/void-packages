name: Build Void Packages

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build-packages:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update system and install dependencies
        run: |
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y sudo bash git curl

      - name: Setup builder user & permissions
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Initialize xbps-src bootstrap
        run: |
          sudo -Hu builder ./xbps-src binary-bootstrap

      - name: Build packages (i686)
        run: |
          sudo -Hu builder ./xbps-src -a i686 pkg libdrm
          sudo -Hu builder ./xbps-src -a i686 pkg mesa
          sudo -Hu builder ./xbps-src -a i686 pkg xf86-video-amdgpu

      - name: Deploy packages to repo/i686
        run: |
          mkdir -p repo/i686
          cp -av hostdir/binpkgs/* repo/i686/

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo/i686

          if ! git diff --cached --quiet; then
            git commit -m "build(i686): update packages in repo/i686"
            git push
          fi
