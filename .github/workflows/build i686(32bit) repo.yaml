name: build-ps4-drivers-i686

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build i686 drivers in Void container
        run: |
          docker run --rm --privileged \
            -v "$PWD":/workspace \
            -w /workspace \
            ghcr.io/void-linux/void-glibc-full \
            sh -c '
              set -ex

              xbps-install -Syu xbps
              xbps-install -yu
              xbps-install -y sudo bash git curl shadow

              useradd -m builder
              chown -R builder:builder /workspace

              sudo -Hu builder ./xbps-src binary-bootstrap

              sudo -Hu builder ./xbps-src pkg libdrm-32bit

              sudo -Hu builder ./xbps-src pkg xf86-video-amdgpu-32bit || {
                echo "=== PATCH REJECTS ==="
                find / -name "*.rej" 2>/dev/null | while read -r f; do
                  echo "--- $f ---"
                  cat "$f"
                done
                exit 1
              }

              sudo -Hu builder ./xbps-src pkg mesa-32bit

              find hostdir/binpkgs -type f \( -name "*.xbps" -o -name "*.sig2" \)

              chown -R root:root /workspace
            '

      - name: Upload i686 packages
        uses: actions/upload-artifact@v4
        with:
          name: i686-packages
          path: |
            hostdir/binpkgs/**/*.xbps
            hostdir/binpkgs/**/*.sig2
          if-no-files-found: error

  repository:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: i686-packages
          path: artifact

      - name: Create i686 repository
        run: |
          mkdir -p repo/i686

      - name: Copy packages
        run: |
          find artifact -type f \( -name "*.xbps" -o -name "*.sig2" \) \
            -exec cp -n {} repo/i686/ \;

      - name: Generate repository index
        run: |
          docker run --rm \
            -v "$PWD/repo/i686":/repo \
            ghcr.io/void-linux/void-glibc-full \
            sh -c '
              xbps-rindex -a /repo/*.xbps
            '

      - name: Show repository contents
        run: |
          ls -lah repo/i686

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f repo/i686

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Add i686 packages"
          git push