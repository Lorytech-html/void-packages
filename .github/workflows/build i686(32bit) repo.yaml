name: build-ps4-drivers-i686

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build i686 drivers in Void container
        run: |
          docker run --rm --privileged \
            -v "$PWD":/workspace \
            -w /workspace \
            ghcr.io/void-linux/void-glibc-full \
            sh -c '
              set -ex

              xbps-install -Syu xbps
              xbps-install -yu
              xbps-install -y sudo bash git curl shadow

              useradd -m builder
              chown -R builder:builder /workspace

              sudo -Hu builder ./xbps-src binary-bootstrap -a i686

              sudo -Hu builder ./xbps-src pkg -a i686 libdrm

              sudo -Hu builder ./xbps-src pkg -a i686 xf86-video-amdgpu || {
                echo "=== PATCH REJECTS ==="
                find / -name "*.rej" 2>/dev/null | while read -r f; do
                  echo "--- $f ---"
                  cat "$f"
                done
                exit 1
              }

              sudo -Hu builder ./xbps-src pkg -a i686 mesa
            '

      - name: Create i686 repository
        run: |
          mkdir -p repo/i686

      - name: Copy packages and signatures
        run: |
          find hostdir/binpkgs/i686 -maxdepth 1 \( -name "*.xbps" -o -name "*.sig2" \) -exec cp -n {} repo/i686/ \;

      - name: Index i686 repository
        run: |
          docker run --rm \
            -v "$PWD/repo/i686":/repo \
            ghcr.io/void-linux/void-glibc-full \
            sh -c 'xbps-rindex -a /repo/*.xbps'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4-drivers-i686
          path: |
            hostdir/binpkgs/i686/**/*.xbps
            hostdir/binpkgs/i686/**/*.sig2

      - name: Commit repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f repo/i686

          if git diff --cached --quiet; then
            echo "No repository changes."
            exit 0
          fi

          git commit -m "Add i686 packages"
          git push