name: build-ps4-drivers-32bit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build 32bit drivers in Void container
        run: |
          docker run --rm --privileged \
            -v "$PWD":/workspace \
            -w /workspace \
            ghcr.io/void-linux/void-glibc-full \
            sh -c '
              set -ex

              xbps-install -Syu xbps
              xbps-install -yu
              xbps-install -y sudo bash git curl shadow

              useradd -m builder
              chown -R builder:builder /workspace

              sudo -Hu builder ./xbps-src binary-bootstrap

              sudo -Hu builder ./xbps-src pkg libdrm-32bit

              sudo -Hu builder ./xbps-src pkg xf86-video-amdgpu-32bit || {
                echo "=== PATCH REJECTS ==="
                find / -name "*.rej" 2>/dev/null | while read -r f; do
                  echo "--- $f ---"
                  cat "$f"
                done
                exit 1
              }

              sudo -Hu builder ./xbps-src pkg mesa-32bit

              find hostdir/binpkgs -type f \( -name "*.xbps" -o -name "*.sig2" \)

              chown -R root:root /workspace
            '

      - name: Upload 32bit packages
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-32bit-packages
          path: |
            hostdir/binpkgs/**/*.xbps
            hostdir/binpkgs/**/*.sig2
          if-no-files-found: error


  repository:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Download xbps static tools
        run: |
          curl -L \
            https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz \
            -o xbps-static.tar.xz
          mkdir xbps-static
          tar -xf xbps-static.tar.xz -C xbps-static


      - name: Download compiled packages
        uses: actions/download-artifact@v4
        with:
          name: x86_64-32bit-packages
          path: extracted


      - name: Prepare repository
        run: |
          set -eux

          mkdir -p repo/x86_64

          find extracted -type f -name '*.xbps' -exec cp {} repo/x86_64/ \;
          find extracted -type f -name '*.xbps.sig2' -exec cp {} repo/x86_64/ \;

          echo "Removing old repodata..."
          rm -f repo/x86_64/*repodata*
          rm -f repo/x86_64/index*
          rm -f repo/x86_64/*.plist

          echo "Removing oversized Rust packages..."
          find repo/x86_64 -type f \( \
            -name 'rust-*.xbps' -o \
            -name 'rust-*.xbps.sig2' -o \
            -name 'rust-bootstrap-*.xbps' -o \
            -name 'rust-bootstrap-*.xbps.sig2' -o \
            -name 'rust-std-*.xbps' -o \
            -name 'rust-std-*.xbps.sig2' -o \
            -name 'rust-src-*.xbps' -o \
            -name 'rust-src-*.xbps.sig2' -o \
            -name 'rust-doc-*.xbps' -o \
            -name 'rust-doc-*.xbps.sig2' -o \
            -name 'cargo-*.xbps' -o \
            -name 'cargo-*.xbps.sig2' -o \
            -name 'cargo-bootstrap-*.xbps' -o \
            -name 'cargo-bootstrap-*.xbps.sig2' \
          \) -delete

          echo "Remaining packages:"
          ls -lh repo/x86_64


      - name: Restore signing key
        run: |
          echo "${{ secrets.REPO_SIGN_KEY }}" > "$GITHUB_WORKSPACE/privkey.pem"
          chmod 600 "$GITHUB_WORKSPACE/privkey.pem"


      - name: Generate repository metadata
        run: |
          export PATH="$PWD/xbps-static/usr/bin:$PATH"
          xbps-rindex -a "$GITHUB_WORKSPACE/repo/x86_64"/*.xbps


      - name: Sign repository
        run: |
          export PATH="$PWD/xbps-static/usr/bin:$PATH"
          xbps-rindex \
            --sign \
            --signedby "Lollo PS4" \
            --privkey "$GITHUB_WORKSPACE/privkey.pem" \
            "$GITHUB_WORKSPACE/repo/x86_64"


      - name: Sign packages
        run: |
          export PATH="$PWD/xbps-static/usr/bin:$PATH"
          xbps-rindex \
            --sign-pkg \
            --privkey "$GITHUB_WORKSPACE/privkey.pem" \
            "$GITHUB_WORKSPACE/repo/x86_64"/*.xbps


      - name: Cleanup
        run: |
          rm -f "$GITHUB_WORKSPACE/privkey.pem"
          rm -rf extracted xbps-static xbps-static.tar.xz


      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f repo/x86_64

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Update signed x86_64 multilib repository"
          git push origin HEAD