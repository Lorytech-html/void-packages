name: build-ps4-i686-repo
on: workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build i686 drivers
        run: |
          docker run --rm --privileged \
            -v "$PWD":/workspace -w /workspace \
            ghcr.io/void-linux/void-glibc-full \
            sh -c '
              xbps-install -Syu xbps &&
              xbps-install -yu &&
              xbps-install -y sudo bash git curl shadow &&
              useradd -m builder &&
              chown -R builder:builder /workspace &&
              sudo -Hu builder ./xbps-src binary-bootstrap &&
              sudo -Hu builder ./xbps-src -a i686 pkg libdrm &&
              sudo -Hu builder ./xbps-src -a i686 pkg mesa &&
              sudo -Hu builder ./xbps-src -a i686 pkg xf86-video-amdgpu
            '

      - name: Assemble repo/i686 (only this folder, nothing else touched)
        run: |
          mkdir -p repo/i686
          find hostdir/binpkgs -maxdepth 1 -name '*.i686.xbps' -exec cp {} repo/i686/ \;

      - name: Ensure signing key exists (reused across runs, never overwritten)
        run: |
          if [ ! -f repo/i686/privkey.pem ]; then
            docker run --rm -v "$PWD/repo/i686":/repo \
              ghcr.io/void-linux/void-glibc-full \
              sh -c 'openssl genrsa -out /repo/privkey.pem 4096'
          fi

      - name: Generate index + sign (.xbps + .sig2)
        run: |
          docker run --rm -v "$PWD/repo/i686":/repo \
            ghcr.io/void-linux/void-glibc-full \
            sh -c '
              xbps-rindex -a /repo/*.xbps &&
              xbps-rindex --sign --signedby "Lollo PS4 i686 repo" --privkey /repo/privkey.pem /repo &&
              xbps-rindex --sign-pkg --privkey /repo/privkey.pem /repo/*.xbps
            '

      - name: Commit ONLY repo/i686, leave everything else untouched
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add repo/i686
          git commit -m "update ps4 i686 driver repo" || echo "nothing to commit"
          git push
