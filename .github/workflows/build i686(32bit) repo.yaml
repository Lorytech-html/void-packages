name: Build Void Packages

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-packages:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full
      options: --privileged
    env:
      XBPS_ALLOW_CHROOT_BREAK: 1

    steps:
      - name: Update system and install dependencies
        run: |
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y bash git curl tar xz

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize xbps-src bootstrap
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./xbps-src binary-bootstrap

      - name: Build packages (i686)
        run: |
          ./xbps-src -a i686 pkg libdrm
          ./xbps-src -a i686 pkg mesa
          ./xbps-src -a i686 pkg xf86-video-amdgpu

      - name: Upload compiled packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: void-packages-i686
          path: hostdir/binpkgs
