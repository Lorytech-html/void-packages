name: Debug xbps-src

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Debug xbps-src
        run: |
          docker run --rm --privileged \
            -v "$PWD":/workspace \
            -w /workspace \
            ghcr.io/void-linux/void-glibc-full \
            sh -c '
              set -ex

              xbps-install -Syu xbps
              xbps-install -yu
              xbps-install -y sudo bash git curl shadow

              useradd -m builder
              chown -R builder:builder /workspace

              echo "===== Repository ====="
              pwd
              ls -lah
              ls -lah etc || true

              echo "===== xbps-src version ====="
              sudo -Hu builder ./xbps-src --version || true

              echo "===== xbps-src help ====="
              sudo -Hu builder ./xbps-src -h || true

              echo "===== xbps-src help binary-bootstrap ====="
              sudo -Hu builder ./xbps-src binary-bootstrap -h || true

              echo "===== Testing binary-bootstrap ====="
              sudo -Hu builder ./xbps-src binary-bootstrap || true

              echo "===== masterdir ====="
              ls -lah masterdir || true

              echo "===== masterdir contents ====="
              find masterdir -maxdepth 2 || true

              echo "===== hostdir ====="
              ls -lah hostdir || true

              echo "===== hostdir/binpkgs ====="
              find hostdir/binpkgs -maxdepth 2 || true

              echo "===== Done ====="
            '