name: Build i686 Repository for mesa etc..

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-i686:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build i686 (32-bit) drivers
        run: |
          docker run --rm --privileged \
            -v "$PWD":/workspace -w /workspace \
            ghcr.io/void-linux/void-glibc-full \
            sh -c '
              set -e

              xbps-install -Syu xbps
              xbps-install -yu
              xbps-install -y sudo bash git curl shadow

              useradd -m builder
              chown -R builder:builder /workspace

              sudo -Hu builder ./xbps-src binary-bootstrap -a i686

              sudo -Hu builder ./xbps-src pkg -a i686 libdrm
              sudo -Hu builder ./xbps-src pkg -a i686 mesa
              sudo -Hu builder ./xbps-src pkg -a i686 xf86-video-amdgpu
            '

      - name: Create i686 repository
        run: |
          mkdir -p repo/i686

      - name: Copy i686 packages
        run: |
          find hostdir/binpkgs/i686 -maxdepth 1 -name "*.xbps" -exec cp -n {} repo/i686/ \;

      - name: Index i686 repository
        run: |
          docker run --rm \
            -v "$PWD/repo/i686":/repo \
            ghcr.io/void-linux/void-glibc-full \
            sh -c 'xbps-rindex -a /repo/*.xbps'

      - name: Commit updated repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add repo/i686

          if git diff --cached --quiet; then
            echo "No edits"
            exit 0
          fi

          git commit -m "Add i686 packages"
          git push
